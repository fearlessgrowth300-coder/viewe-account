<body class="bg-[#0B0E14] text-slate-200 antialiased overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper to render Lucide SVG Icon dynamically
    const Icon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px;"></i>`;
          window.lucide.createIcons({
            root: iconRef.current
          });
        }
      }, [name, size, className]);

      return <span ref={iconRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [activeModal, setActiveModal] = useState(null);

      // Customizable Configuration
      const [viewerCount, setViewerCount] = useState(1);
      const [activeChatters, setActiveChatters] = useState(1);
      const [disableViewerlist, setDisableViewerlist] = useState(false);
      const [autoFollow, setAutoFollow] = useState(true);
      const [autoUnlockChat, setAutoUnlockChat] = useState(true);
      const [useAIChat, setUseAIChat] = useState(true);
      const [selectedPlatform, setSelectedPlatform] = useState('twitch');
      const [channelName, setChannelName] = useState('cloverreggie');
      const [isStarting, setIsStarting] = useState(false);
      const [wsConnected, setWsConnected] = useState(false);

      // Live Telemetry Stats
      const [stats, setStats] = useState({
        active_viewers: 1,
        total_chatters: 1,
        plans_running: 1,
        proxy_bandwidth_mb: 48.6,
        chat_messages_per_min: 18,
        system_telemetry: { cpu_percent: 12.4, ram_percent: 21.0 }
      });

      // Live Real-Time Chat Stream
      const [chatMessages, setChatMessages] = useState([
        { id: 1, user: 'olaisaboy4', bot: true, isAI: true, text: 'stream looking super clean today 🔥', time: '06:12' },
        { id: 2, user: 'fearless_fan', bot: false, text: 'what games are we playing next?', time: '06:13' },
        { id: 3, user: 'boy_mular3', bot: true, isAI: true, text: 'actual hype moment haha', time: '06:14' },
        { id: 4, user: 'cloverreggie_mod', bot: false, text: 'welcome in everyone!', time: '06:15' },
      ]);

      const wsRef = useRef(null);

      // Auto-connect to backend websocket if running, fallback graceful
      useEffect(() => {
        try {
          const ws = new WebSocket('ws://127.0.0.1:8000/ws/live');
          wsRef.current = ws;

          ws.onopen = () => setWsConnected(true);
          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data.type === 'chat_message') {
                setChatMessages((prev) => [...prev.slice(-30), data.payload]);
              } else if (data.type === 'telemetry_update') {
                setStats(data.payload);
              }
            } catch (e) {}
          };
          ws.onclose = () => setWsConnected(false);
        } catch (e) {}

        return () => wsRef.current?.close();
      }, []);

      const handleStartTask = async () => {
        setIsStarting(true);
        try {
          const payload = {
            channel_name: channelName,
            platform: selectedPlatform === 'twitch' ? 'Twitch' : 'Kick',
            viewer_count: Number(viewerCount),
            use_chat: true,
            use_ai_llm_chat: useAIChat,
            auto_follow: autoFollow,
            auto_unlock_chat: autoUnlockChat,
            proxy_tier: 'Residential'
          };

          const res = await fetch('http://127.0.0.1:8000/api/tasks/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          alert(`Swarm Initialized: ${data.message || 'Worker running'}`);
        } catch (e) {
          alert(`Ready to launch! You can also execute via CLI: .\\twitch-engine.exe -channel ${channelName} -workers ${viewerCount}`);
        } finally {
          setIsStarting(false);
          setActiveModal(null);
        }
      };

      const navItems = [
        { name: 'Dashboard', icon: 'layout-dashboard' },
        { name: 'My Channels', icon: 'tv' },
        { name: 'Plans & Workers', icon: 'layers' },
        { name: 'Chat Lists', icon: 'message-square' },
        { name: 'Telemetry & Stats', icon: 'bar-chart-3' },
        { name: 'Proxy Pool', icon: 'globe' },
        { name: 'Accounts Hub', icon: 'user-check' },
        { name: 'Settings', icon: 'settings' },
      ];

      return (
        <div className="flex h-screen w-full bg-[#0B0E14] text-slate-200 overflow-hidden">

                  <Icon name="sparkles" size={20} className="text-white" />
                </div>
                <div>

            {/* Dashboard Body */}

              {/* Header Title & Quick Actions */}

                    <p className="text-3xl font-black text-white mt-1.5">{viewerCount}</p>

                  </div>
                  <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center">

                    <div className="p-3.5 rounded-xl bg-[#0D111A] border border-[#1E2638] flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-xs font-bold">
                          BM
                        </div>
                        <div>
                          <p className="text-xs font-bold text-white">@boy_mular3</p>
                          <p className="text-[10px] text-purple-400">OAuth & Session Cookies Active</p>
                        </div>
                      </div>
                      <span className="px-2 py-0.5 rounded-md bg-purple-500/10 text-purple-400 text-[10px] font-bold border border-purple-500/20">
                        IP Locked (Port 51486)
                      </span>
                    </div>
                  </div>
                </div>

                {/* Residential Proxy Bridges */}
                <div className="bg-[#161B26] border border-[#1E2638] rounded-2xl p-6 space-y-4">
                  <div className="flex items-center justify-between border-b border-[#1E2638] pb-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="globe" size={16} className="text-emerald-400" /> SOAX Residential Proxy Bridge
                    </h3>
                    <span className="text-xs text-emerald-400 font-mono">6 Connected</span>
                  </div>

                  <div className="space-y-2.5">
                    <div className="p-3 rounded-xl bg-[#0D111A] border border-[#1E2638] flex items-center justify-between text-xs">
                      <div>
                        <p className="font-bold text-white">💎 Zia_Faceless_Mom</p>
                        <p className="text-[10px] text-slate-500 font-mono">http://127.0.0.1:17361</p>
                      </div>
                      <span className="text-emerald-400 font-bold text-[11px]">Active</span>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0D111A] border border-[#1E2638] flex items-center justify-between text-xs">
                      <div>
                        <p className="font-bold text-white">💎 Ruby_Digital_Mom</p>
                        <p className="text-[10px] text-slate-500 font-mono">http://127.0.0.1:17362</p>
                      </div>
                      <span className="text-emerald-400 font-bold text-[11px]">Active</span>
                    </div>
                  </div>
                </div>

              </div>

            </main>
          </div>

          {/* ================= MODAL: LAUNCH SWARM ================= */}
          {activeModal === 'add-channel' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-[#161B26] border border-[#1E2638] rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between px-6 py-4 border-b border-[#1E2638]">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="play" size={16} className="text-[#6366F1]" /> Launch Custom Worker Swarm
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white p-1 cursor-pointer">
                    <Icon name="x" size={16} />
                  </button>
                </div>

                <div className="p-6 space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Target Channel Username</label>
                    <input
                      type="text"
                      value={channelName}
                      onChange={(e) => setChannelName(e.target.value)}
                      placeholder="cloverreggie"
                      className="w-full bg-[#0D111A] border border-[#1E2638] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#6366F1]"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Concurrent Windows (Workers)</label>
                    <input
                      type="number"
                      min="1"
                      max="50"
                      value={viewerCount}
                      onChange={(e) => setViewerCount(Number(e.target.value))}
                      className="w-full bg-[#0D111A] border border-[#1E2638] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#6366F1]"
                    />
                    <p className="text-[10px] text-slate-500 mt-1">Runs visible on screen with automatic IP lock-in</p>
                  </div>

                  <button 
                    onClick={handleStartTask}
                    disabled={isStarting}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-[#6366F1] to-[#8B5CF6] hover:from-[#4F46E5] hover:to-[#7C3AED] text-white text-xs font-bold shadow-lg shadow-[#6366F1]/25 mt-2 cursor-pointer transition-all"
                  >
                    {isStarting ? 'Starting Chrome Instances...' : '🚀 Launch Engine Swarm'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: WORKER SETTINGS ================= */}
          {activeModal === 'manage-plan' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-[#161B26] border border-[#1E2638] rounded-2xl shadow-2xl overflow-hidden">
                <div className="flex items-center justify-between px-6 py-4 border-b border-[#1E2638]">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="sliders" size={16} className="text-[#6366F1]" /> Worker Engine Preferences
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white p-1 cursor-pointer">
                    <Icon name="x" size={16} />
                  </button>
                </div>
                <div className="p-6 space-y-4 text-xs">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-[#0D111A] border border-[#1E2638]">
                    <span className="font-semibold text-slate-300">Headless (Background) Mode</span>
                    <span className="text-purple-400 font-bold">False (Always Visible)</span>
                  </div>
                  <div className="flex items-center justify-between p-3 rounded-xl bg-[#0D111A] border border-[#1E2638]">
                    <span className="font-semibold text-slate-300">Window Persistence</span>
                    <span className="text-emerald-400 font-bold">Infinite (Until Ctrl+C)</span>
                  </div>
                  <div className="flex items-center justify-between p-3 rounded-xl bg-[#0D111A] border border-[#1E2638]">
                    <span className="font-semibold text-slate-300">GQL Follow Verification</span>
                    <span className="text-emerald-400 font-bold">Direct Payload Active</span>
                  </div>
                  <button 
                    onClick={() => setActiveModal(null)}
                    className="w-full py-2.5 rounded-xl bg-[#161B26] hover:bg-[#1E2638] border border-[#1E2638] text-white font-bold cursor-pointer"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: LIVE CHAT STREAM ================= */}
          {activeModal === 'live-chat' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-lg bg-[#161B26] border border-[#1E2638] rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[520px]">
                <div className="flex items-center justify-between px-6 py-4 border-b border-[#1E2638]">
                  <div className="flex items-center gap-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="message-square" size={16} className="text-[#6366F1]" /> Live Stream Chat Feed
                    </h3>
                    <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-[10px] font-bold">● Active Room</span>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white p-1 cursor-pointer">
                    <Icon name="x" size={16} />
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-2.5 bg-[#0D111A] font-mono text-xs">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className="flex items-start gap-2 p-2 rounded hover:bg-[#161B26]/60 border border-transparent hover:border-[#1E2638]">
                      <span className="text-[10px] text-slate-500">{msg.time}</span>
                      {msg.isAI && <span className="px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-400 text-[9px] font-extrabold border border-purple-500/30">AI-BOT</span>}
                      <span className="font-bold text-purple-400">{msg.user}:</span>
                      <span className="text-slate-200">{msg.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
